<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Hichem Benali. An original route of ideas and evidence, with a small moving marker.">
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#253339" opacity=".10"/>
    </pattern>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#8E9B77"/>
      <stop offset="1" stop-color="#E76F60"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" fill="#F9F6EF"/>
  <rect width="1200" height="330" fill="url(#paper)"/>
  <rect x="28" y="27" width="1144" height="276" rx="20" fill="none" stroke="#253339" opacity=".22" stroke-width="2"/>
  <path d="M70 56 H134" stroke="#E76F60" stroke-width="8" stroke-linecap="round"/>
  <text x="70" y="96" fill="#53604F" font-size="23" font-weight="700" letter-spacing="5" font-family="Arial, Helvetica, sans-serif">THE WORK, NOT THE HYPE</text>
  <text x="64" y="203" fill="#253339" font-size="112" font-weight="700" letter-spacing="-4" font-family="Georgia, 'Times New Roman', serif">HICHEM</text>
  <text x="64" y="289" fill="#253339" font-size="94" font-weight="700" letter-spacing="-3" font-family="Georgia, 'Times New Roman', serif">BENALI</text>
  <line x1="656" y1="69" x2="656" y2="275" stroke="#253339" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(710 48)">
    <text x="0" y="24" fill="#53604F" font-size="20" font-weight="700" letter-spacing="3" font-family="Arial, Helvetica, sans-serif">A SMALL TRAIL OF PROOF</text>
    <path id="route" d="M15 88 H154 V157 H284 V99 H403" fill="none" stroke="#D9DECC" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 88 H154 V157 H284 V99 H403" fill="none" stroke="url(#trail)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 13"/>
    <circle cx="15" cy="88" r="13" fill="#53604F" stroke="#F9F6EF" stroke-width="4"/>
    <rect x="142" y="145" width="24" height="24" rx="5" fill="#8E9B77" stroke="#F9F6EF" stroke-width="4"/>
    <rect x="272" y="87" width="24" height="24" rx="5" fill="#8E9B77" stroke="#F9F6EF" stroke-width="4"/>
    <circle cx="403" cy="99" r="18" fill="#253339" stroke="#F9F6EF" stroke-width="4"/>
    <path d="M394 100 l6 7 l12 -17" stroke="#F9F6EF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <circle cx="15" cy="88" r="12" fill="#E76F60" stroke="#F9F6EF" stroke-width="4">
        <animateMotion dur="12s" repeatCount="indefinite" keyTimes="0;0.85;1" keyPoints="0;1;1" calcMode="linear"><mpath xlink:href="#route"/></animateMotion>
      </circle>
    </g>
    <text x="0" y="230" fill="#253339" font-size="21" font-weight="600" letter-spacing="1" font-family="Arial, Helvetica, sans-serif">ASK     BUILD     CHECK     LEARN</text>
  </g>
</svg>
